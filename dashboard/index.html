<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deviation Atlas — Track Record</title>
<style>
  /* Role tokens (reference palette; swap for brand values in one place) */
  :root {
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --status-good:    #0ca30c;
    --status-good-text: #006300;
    --status-warning: #fab219;
    --status-critical:#d03b3b;
    --select-wash:    rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --hairline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --status-good:    #0ca30c;
      --status-good-text: #0ca30c;
      --status-warning: #fab219;
      --status-critical:#d03b3b;
      --select-wash:    rgba(57,135,229,0.18);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.35rem; font-weight: 650; }
  .sub { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }

  /* Verdict banner — icon + label, never color alone */
  .verdict {
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-1);
    padding: 10px 14px; margin: 14px 0 6px;
    font-weight: 600; font-size: 0.95rem;
  }
  .verdict .detail { font-weight: 400; color: var(--text-secondary); font-size: 0.85rem; }
  .pass { color: var(--status-good-text); }
  .fail { color: var(--status-critical); }
  .warn { color: var(--status-warning); }
  .fragile-note {
    display: block; width: 100%;
    font-weight: 400; color: var(--text-secondary); font-size: 0.8rem; margin-top: 4px;
  }

  /* Stat tiles */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px; margin: 18px 0 10px;
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label { color: var(--text-secondary); font-size: 0.78rem; }
  .tile .value { font-size: 1.45rem; font-weight: 600; margin-top: 4px; }
  .tile .value .ci { font-size: 0.85rem; font-weight: 400; color: var(--text-secondary); }
  .tile .note  { color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; }
  .tile.hero .value { font-size: 2.6rem; }
  .tile.hero .value .ci { font-size: 1rem; }
  .tile.hero { grid-column: span 2; }

  .footnote {
    color: var(--text-muted); font-size: 0.75rem; line-height: 1.5;
    margin: 0 0 26px; max-width: 72ch;
  }

  /* Comparable-cases panel */
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px; margin-bottom: 26px;
  }
  .panel h2 { font-size: 1rem; margin-bottom: 2px; }
  .panel .sub { margin-bottom: 8px; }

  /* Tables */
  h2 { font-size: 1.05rem; margin-bottom: 4px; }
  .tablewrap {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto; margin-top: 10px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { text-align: right; padding: 7px 14px; white-space: nowrap; }
  th:first-child, td:first-child, th:last-child, td:last-child { text-align: left; }
  th {
    color: var(--text-muted); font-weight: 500; font-size: 0.75rem;
    border-bottom: 1px solid var(--hairline);
    position: sticky; top: 0; background: var(--surface-1);
  }
  td { border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  #history tbody tr { cursor: pointer; }
  #history tbody tr:hover { background: var(--select-wash); }
  #history tbody tr.selected { background: var(--select-wash); }
  #history tbody tr.selected td:first-child { font-weight: 600; }
  .outcome { display: inline-flex; align-items: center; gap: 6px; }
  .err {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; color: var(--status-critical);
  }
  code { font-size: 0.85em; }
</style>
</head>
<body>
<header>
  <h1>The Deviation Atlas — track record</h1>
  <div class="sub" id="meta">Loading dashboard_data.json…</div>
</header>
<main id="app"></main>

<script>
"use strict";
/* Display layer ONLY — every number below is pre-computed by Python
   (metrics.py / null_gate.py / uncertainty.py via export_dashboard_data.py).
   This file formats and renders; it never derives a metric, distance, or
   sort order. Comparable cases use precomputed neighbor indices. */

let DATA = null;

const pct  = (x, d = 1) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const num  = x => x == null ? "—" : x.toLocaleString("en-US");
const fx   = (x, d = 2) => x == null ? "—" : x.toFixed(d);
const days = x => x == null ? "—" : `${(+x).toFixed(0)}d`;
const esc  = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const rng  = (lo, hi, d = 1) => (lo == null || hi == null)
  ? "" : ` <span class="ci">[${pct(lo, d)}–${pct(hi, d)}]</span>`;

function tile(label, value, note, opts = {}) {
  const title = opts.hover ? ` title="${esc(opts.hover)}"` : "";
  return `<div class="tile${opts.hero ? " hero" : ""}"${title}>
    <div class="label">${esc(label)}</div>
    <div class="value">${value}</div>
    ${note ? `<div class="note">${esc(note)}</div>` : ""}
  </div>`;
}

function verdictBanner(g, h) {
  let head, cls;
  if (!g.v1_pass)       { cls = "fail"; head = "✕ V1 gate: FAIL"; }
  else if (g.fragile)   { cls = "warn"; head = "⚠ V1 gate: PASS (fragile)"; }
  else                  { cls = "pass"; head = "✓ V1 gate: PASS"; }
  const fragileNote = g.fragile ? `<span class="fragile-note">Fragile: the
    clustering-aware CI lower bound for precision (${pct(h.precision_ci_bb_low)})
    falls at or below the null model's 95th percentile (${pct(g.null_p95)}) —
    the pass is not robust to regime-level uncertainty.</span>` : "";
  return `<div class="verdict">
    <span class="${cls}">${head}</span>
    <span class="detail">
      lift gate ${g.lift_gate_pass ? "pass" : "fail"} (${fx(g.real_lift)}x vs ≥1.5) ·
      precision gate ${g.precision_gate_pass ? "pass" : "fail"}
      (${pct(g.real_precision)} vs null 95th pct ${pct(g.null_p95)}, p=${fx(g.p_value, 3)})
    </span>
    ${fragileNote}
  </div>`;
}

function eventRow(e, i, selected) {
  const hit = e.outcome === "hit";
  return `<tr data-idx="${i}" class="${i === selected ? "selected" : ""}">
    <td>${esc(e.flag_date)}</td>
    <td>${fx(e.signal_value, 4)}</td>
    <td>${fx(e.threshold, 4)}</td>
    <td>${pct(e.max_drawdown_30d, 2)}</td>
    <td>${e.lead_time == null ? "—" : days(e.lead_time)}</td>
    <td><span class="outcome ${hit ? "fail" : ""}">${hit ? "▼ hit" : "○ false alarm"}</span></td>
  </tr>`;
}

function neighborRows(idx) {
  /* Neighbor indices are precomputed in Python (nearest by |signal_value|
     distance) — this just looks them up and prints rows. */
  return DATA.events[idx].neighbors.map(j => {
    const e = DATA.events[j];
    const hit = e.outcome === "hit";
    return `<tr>
      <td>${esc(e.flag_date)}</td>
      <td>${fx(e.signal_value, 4)}</td>
      <td>${pct(e.max_drawdown_30d, 2)}</td>
      <td>${e.lead_time == null ? "—" : days(e.lead_time)}</td>
      <td><span class="outcome ${hit ? "fail" : ""}">${hit ? "▼ hit" : "○ false alarm"}</span></td>
    </tr>`;
  }).join("");
}

function renderComparable(idx) {
  const e = DATA.events[idx];
  document.getElementById("cmp-sub").innerHTML =
    `Viewing <strong>${esc(e.flag_date)}</strong> (signal ${fx(e.signal_value, 4)},
     ${e.outcome === "hit" ? "hit" : "false alarm"}) — the ${DATA.n_neighbors}
     past flags with the closest signal value, and what happened next:`;
  document.getElementById("cmp-body").innerHTML = neighborRows(idx);
  document.querySelectorAll("#history tbody tr").forEach(tr => {
    tr.classList.toggle("selected", +tr.dataset.idx === idx);
  });
}

async function render() {
  const app = document.getElementById("app");
  let d;
  try {
    const r = await fetch("dashboard_data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    d = await r.json();
  } catch (err) {
    app.innerHTML = `<div class="err">Could not load <code>dashboard_data.json</code>
      (${esc(err.message)}). If opened as a file://, serve the folder instead:
      <code>python -m http.server</code> then open http://localhost:8000/dashboard/</div>`;
    return;
  }
  DATA = d;

  const h = d.headline, g = d.null_gate, m = d.ci_method;
  const selected = 0;   // default: most recent flag (events ship newest-first)
  const ciHover = `${m.name} — block=${m.block}, ${m.runs} resamples, seed=${m.seed}. ${m.assumption}`;

  document.getElementById("meta").textContent =
    `${d.ticker} · ${num(h.n_days)} classified trading days · generated ${d.generated_at}`;

  app.innerHTML = `
    ${verdictBanner(g, h)}
    <div class="tiles">
      ${tile("Precision (hits / flags)",
             `${pct(h.precision)}${rng(h.precision_ci_bb_low, h.precision_ci_bb_high)}`,
             "95% CI, block bootstrap — see footnote", { hero: true, hover: ciHover })}
      ${tile("Signal fired", num(h.total_flags), `across ${num(h.n_days)} days`)}
      ${tile("Hits", num(h.hit_count), ">5% drawdown followed within 30 days")}
      ${tile("False alarms", num(h.false_alarm_count), "no such drawdown followed")}
      ${tile("Base rate", pct(h.base_rate), "any-day 5%/30d drawdown probability")}
      ${tile("Lift", fx(h.lift) + "x", "precision / base rate")}
      ${tile("Hit rate (TPR)",
             `${pct(h.hit_rate_tpr)}${rng(h.tpr_ci_bb_low, h.tpr_ci_bb_high)}`,
             "flags among all drawdown days", { hover: ciHover })}
      ${tile("False alarm rate (FPR)",
             `${pct(h.false_alarm_rate_fpr)}${rng(h.fpr_ci_bb_low, h.fpr_ci_bb_high)}`,
             "flags among calm days", { hover: ciHover })}
      ${tile("Avg drawdown on hits", pct(h.avg_drawdown_on_hits),
             `median ${pct(h.median_drawdown_on_hits)}`)}
      ${tile("Avg lead time on hits", days(h.avg_lead_time_on_hits), "flag to −5% crossing")}
    </div>
    <p class="footnote">Uncertainty ranges are 95% CIs from a
      ${esc(m.name)} (block=${m.block}, ${num(m.runs)} resamples, fixed seed
      ${m.seed}). ${esc(m.assumption)} Wilson 95% CI on precision for comparison:
      ${pct(h.precision_ci_low)}–${pct(h.precision_ci_high)} — narrower because it
      wrongly treats clustered flag-days as independent trials.</p>

    <div class="panel">
      <h2>Comparable past cases</h2>
      <div class="sub" id="cmp-sub"></div>
      <div class="tablewrap"><table>
        <thead><tr>
          <th>Flag date</th><th>Signal (vol_20)</th>
          <th>Max drawdown 30d</th><th>Lead time</th><th>Outcome</th>
        </tr></thead>
        <tbody id="cmp-body"></tbody>
      </table></div>
      <div class="sub" style="margin-top:8px">Click any row in the history table
        below to compare a different flag.</div>
    </div>

    <h2>Per-signal history</h2>
    <div class="sub">All ${num(d.events.length)} flag events, unfiltered — false alarms included.</div>
    <div class="tablewrap" id="history"><table>
      <thead><tr>
        <th>Flag date</th><th>Signal (vol_20)</th><th>Threshold</th>
        <th>Max drawdown 30d</th><th>Lead time</th><th>Outcome</th>
      </tr></thead>
      <tbody>${d.events.map((e, i) => eventRow(e, i, selected)).join("")}</tbody>
    </table></div>`;

  renderComparable(selected);
  document.querySelector("#history tbody").addEventListener("click", ev => {
    const tr = ev.target.closest("tr[data-idx]");
    if (tr) renderComparable(+tr.dataset.idx);
  });
}
render();
</script>
</body>
</html>
